set -g mouse on
set -g base-index 1
set -g set-titles on
set -g status-style "#{?window_zoomed_flag,bg=yellow fg=black,bg=green fg=black}"
setw -g pane-base-index 1
setw -g mode-keys vi

bind C-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded."

bind -n M-h select-pane -LZ
bind -n M-j select-pane -DZ
bind -n M-k select-pane -UZ
bind -n M-l select-pane -RZ

bind -n M-H select-pane -L \; swap-pane -ds '!'
bind -n M-J select-pane -D \; swap-pane -ds '!'
bind -n M-K select-pane -U \; swap-pane -ds '!'
bind -n M-L select-pane -R \; swap-pane -ds '!'

bind -n C-M-h resize-pane -L
bind -n C-M-j resize-pane -D
bind -n C-M-k resize-pane -U
bind -n C-M-l resize-pane -R
bind -n M-f resize-pane -Z

bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n M-d split-window -v -c "#{pane_current_path}"

bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
